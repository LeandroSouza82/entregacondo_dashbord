<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ecGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <filter id="ecShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7C2D12" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Squircle Background -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#ecGrad)" filter="url(#ecShadow)" />
  
  <!-- Isometric Package Icon -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(14, 14)">
    <!-- Top Face -->
